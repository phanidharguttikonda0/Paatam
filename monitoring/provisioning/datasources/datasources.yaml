apiVersion: 1

datasources:
  # ==========================================
  # 1. AWS CloudWatch (Logs & Infrastructure)
  # ==========================================
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      authType: default
      defaultRegion: ap-south-2

  # ==========================================
  # 2. AWS Managed Prometheus (AMP) with SigV4
  # ==========================================
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: https://aps-workspaces.ap-south-2.amazonaws.com/workspaces/ws-6253c683-b281-4bab-a14c-f1134b426632
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      sigV4Auth: true
      sigV4AuthType: default
      sigV4Region: ap-south-2
      prometheusType: 'Amazon Managed Service for Prometheus'
      prometheusVersion: '2.40.0'
      disableRecordingRules: true

  # ==========================================
  # 3. AWS X-Ray (Distributed Tracing)
  # ==========================================
  - name: X-Ray
    type: grafana-x-ray-datasource
    uid: xray
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      authType: default
      defaultRegion: ap-south-2
